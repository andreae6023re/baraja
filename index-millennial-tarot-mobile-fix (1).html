<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Millennial Tarot</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');
:root{--bg:#111317;--panel:#191b20;--line:#45423d;--text:#e8e0d2;--muted:#aaa294;--gold:#c6a875;--black:#000}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:Inter,sans-serif}
button{font:inherit}
.page{width:min(calc(100% - 28px),900px);margin:auto;padding:30px 0 60px}
.home{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.ornament{color:var(--gold);font-size:28px;margin-bottom:22px}
.eyebrow{color:var(--gold);letter-spacing:.25em;font-size:10px;font-weight:600;margin:0 0 18px}
h1,h2,h3{font-family:"Cormorant Garamond",serif;font-weight:500}
h1{font-size:clamp(52px,10vw,88px);line-height:.82;margin:0}
h1 em{color:var(--gold)}
h2{font-size:clamp(40px,8vw,64px);margin:0 0 5px}
.intro{color:var(--muted);line-height:1.7;max-width:520px;margin:12px auto 26px}
.primary{border:1px solid var(--gold);background:transparent;color:var(--text);padding:14px 25px;border-radius:2px;cursor:pointer}
.primary:hover{background:var(--gold);color:#151515}
.footer-note{color:#77746d;font-family:"Cormorant Garamond",serif;font-size:16px;margin-top:50px}
.back{border:0;background:none;color:var(--muted);padding:0;cursor:pointer;margin-bottom:40px}
.spread-list{display:grid;gap:12px;margin-top:30px}
.spread-card{width:100%;display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:16px;text-align:left;border:1px solid var(--line);background:rgba(25,27,32,.78);color:var(--text);padding:18px;cursor:pointer}
.spread-card:hover{border-color:var(--gold)}
.spread-number{color:var(--gold);font-family:"Cormorant Garamond",serif;font-size:28px}
.spread-card strong{display:block;font-family:"Cormorant Garamond",serif;font-size:25px;font-weight:500}
.spread-card small{display:block;color:var(--muted);margin-top:3px}
.arrow{color:var(--gold);font-size:20px}

.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:28px}
.tarot-item{min-width:0;text-align:center}
.card-frame{background:#000;overflow:hidden;width:100%;aspect-ratio:2/3;line-height:0}
.card-image{display:block;width:104%;height:104%;max-width:none;margin:-2%;object-fit:cover;border:0;box-shadow:none;cursor:pointer;transition:transform .18s ease}
.card-image:hover{transform:scale(1.015)}
.tarot-item.reversed .card-image{transform:rotate(180deg) scale(1.04)}
.tarot-item.reversed .card-image:hover{transform:rotate(180deg) scale(1.055)}
.card-label{margin-top:10px}
.card-position{color:var(--gold);font-size:9px;letter-spacing:.16em;text-transform:uppercase}
.card-name{font-family:"Cormorant Garamond",serif;font-size:25px;margin-top:3px}
.card-state{color:var(--muted);font-size:9px;letter-spacing:.13em;margin-top:3px}
.tap-hint{color:#77746d;font-size:10px;margin-top:5px}
.draw-card{min-height:260px;border:1px dashed #575044;background:#000;color:var(--gold);cursor:pointer;font-family:"Cormorant Garamond",serif;font-size:24px}
.draw-card:hover{background:#0b0b0b;border-color:var(--gold)}
.draw-card span{display:block;margin-top:12px}
.reading .primary{margin-top:28px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:flex-end;justify-content:center;padding:14px;z-index:20}
.modal.open{display:flex}
.modal-box{width:min(100%,620px);max-height:88svh;overflow:auto;background:#191b20;border:1px solid #45423d;padding:24px 22px 28px;box-shadow:0 20px 60px #000}
.modal-close{float:right;border:0;background:none;color:var(--muted);font-size:24px;cursor:pointer}
.modal-eyebrow{color:var(--gold);letter-spacing:.18em;font-size:9px;text-transform:uppercase;margin:4px 0 8px}
.modal h3{font-size:42px;line-height:1;margin:0 30px 14px 0}
.modal .meaning{font-size:14px;line-height:1.7;color:var(--text);margin:0 0 14px}
.modal .reverse{font-size:13px;line-height:1.7;color:var(--muted);margin:0}
.modal .reverse strong{color:var(--gold);font-weight:500}

@media(max-width:650px){
 .page{width:min(calc(100% - 24px),520px);padding:24px 0 48px}
 .back{margin-bottom:30px}
 .spread-card{padding:15px;grid-template-columns:40px 1fr auto}
 .cards{grid-template-columns:1fr;gap:30px;margin-top:24px}
 .tarot-item{width:100%}
 .card-frame{width:86vw;max-width:390px;margin:0 auto}
 .card-label{margin-top:9px}
 .card-name{font-size:27px}
 .draw-card{min-height:190px}
 .modal{padding:10px}
 .modal-box{padding:20px 18px 24px;max-height:90svh}
 .modal h3{font-size:38px}
}
@media(min-width:651px){.draw-card{min-height:420px}}
</style>
</head>

  ["El Loco", "Nuevos comienzos, libertad y confianza.", "Impulso para empezar algo nuevo y avanzar con curiosidad. Al revés puede señalar imprudencia, falta de preparación o miedo a dar el salto.", "carta-00-el-loco.jpg", "Arcanos Mayores"],
  ["El Mago", "Recursos, iniciativa y capacidad de crear.", "Tienes herramientas para actuar y transformar una idea en algo concreto. Al revés: dispersión, manipulación o recursos mal utilizados.", "carta-01-el-mago.jpg", "Arcanos Mayores"],
  ["La Sacerdotisa", "Intuición, misterio y conocimiento interior.", "Invita a observar, escuchar la intuición y no forzar una respuesta. Al revés: secretos, desconexión interior o ignorar señales.", "carta-02-la-sacerdotisa.jpg", "Arcanos Mayores"],
  ["El Emperador", "Estructura, estabilidad y autoridad.", "Habla de orden, límites y responsabilidad. Al revés: rigidez, control excesivo o estructuras que ya no ayudan.", "carta-03-el-emperador.jpg", "Arcanos Mayores"],

  ["Seis de Oros", "Avance, intercambio o recuerdo relacionado con recursos, trabajo, estabilidad, cuerpo y mundo material.", "Al revés: dificultad para avanzar o apego al pasado.", "carta-69-seis-de-oros.jpg", "Arcanos Menores"],
  ["Siete de Oros", "Evaluación, estrategia o búsqueda de perspectiva sobre recursos, trabajo, estabilidad, cuerpo y mundo material.", "Al revés: dudas, expectativas poco realistas o falta de estrategia.", "carta-70-siete-de-oros.jpg", "Arcanos Menores"],
  ["Ocho de Oros", "Movimiento, dedicación o profundización en recursos, trabajo, estabilidad, cuerpo y mundo material.", "Al revés: bloqueo, exceso de esfuerzo o dificultad para avanzar.", "carta-71-ocho-de-oros.jpg", "Arcanos Menores"],
  ["Nueve de Oros", "Madurez, resultado o satisfacción vinculada a recursos, trabajo, estabilidad, cuerpo y mundo material.", "Al revés: insatisfacción, exceso o resultado que no llena.", "carta-72-nueve-de-oros.jpg", "Arcanos Menores"],
  ["Diez de Oros", "Culminación y consecuencias de un ciclo relacionado con recursos, trabajo, estabilidad, cuerpo y mundo material.", "Al revés: carga, exceso o cierre complicado.", "carta-73-diez-de-oros.jpg", "Arcanos Menores"],
  ["Sota de Oros", "Curiosidad, aprendizaje y noticias relacionadas con recursos, trabajo, estabilidad, cuerpo y mundo material.", "Al revés: inmadurez, mensaje confuso o falta de preparación.", "carta-74-sota-de-oros.jpg", "Arcanos Menores"],
  ["Caballo de Oros", "Movimiento, iniciativa y forma de actuar en recursos, trabajo, estabilidad, cuerpo y mundo material.", "Al revés: precipitación, impulsividad o falta de dirección.", "carta-75-caballo-de-oros.jpg", "Arcanos Menores"],
  ["Reina de Oros", "Madurez, comprensión y dominio de recursos, trabajo, estabilidad, cuerpo y mundo material.", "Al revés: exceso emocional, control o dificultad para expresar esta energía.", "carta-76-reina-de-oros.jpg", "Arcanos Menores"],
  ["Rey de Oros", "Solidez, experiencia y responsabilidad en recursos, trabajo, estabilidad, cuerpo y mundo material.", "Al revés: rigidez, exceso de control o problemas para gestionar recursos.", "carta-77-rey-de-oros.jpg", "Arcanos Menores"]
];
const spreads=[
 {id:"one",name:"Una carta",description:"Una carta para iluminar tu pregunta.",cards:1},
 {id:"three",name:"Tres cartas",description:"Pasado · Presente · Futuro.",cards:3},
 {id:"celtic",name:"Cruz Celta",description:"La tirada clásica de 10 cartas.",cards:10},
 {id:"custom",name:"Personalizada",description:"Cinco cartas para una lectura más amplia.",cards:5}
];
let spread=null,cards=[];

function home(){
 app.innerHTML=`<main class="page home"><div class="ornament">✦</div><p class="eyebrow">MILLENNIAL TAROT</p><h1>Tu lectura.<br><em>Tu intuición.</em></h1><p class="intro">Elige una tirada, respira y deja que las cartas hablen.</p><button class="primary" id="start">Comenzar lectura</button><div class="footer-note">A little magic for ordinary days ✦</div></main>`;
 document.getElementById("start").onclick=spreadsPage;
}
function spreadsPage(){
 app.innerHTML=`<main class="page"><button class="back" id="back">← Volver</button><p class="eyebrow">MILLENNIAL TAROT</p><h2>Elige tu tirada</h2><p class="intro">¿Qué quieres explorar hoy?</p><section class="spread-list">${spreads.map(s=>`<button class="spread-card" data-id="${s.id}"><span class="spread-number">${String(s.cards).padStart(2,"0")}</span><span><strong>${s.name}</strong><small>${s.description}</small></span><span class="arrow">→</span></button>`).join("")}</section></main>`;
 document.getElementById("back").onclick=home;
 document.querySelectorAll(".spread-card").forEach(b=>b.onclick=()=>{spread=spreads.find(s=>s.id===b.dataset.id);cards=[];reading()});
}
function draw(){
 const available=deck.filter(c=>!cards.some(x=>x[0]===c[0]));
 const c=available[Math.floor(Math.random()*available.length)]||deck[0];
 cards.push([...c,Math.random()<.25]);
 reading();
}
function openCard(c){
 modalType.textContent=`${c[4]} · ${c[3].includes("carta-")?"Millennial Tarot":""}`;
 modalTitle.textContent=c[0];
 modalMeaning.textContent=c[1];
 modalReverse.innerHTML=`<strong>Si aparece invertida:</strong> ${c[2]}`;
 modal.classList.add("open");
 modal.setAttribute("aria-hidden","false");
}
function closeModal(){
 modal.classList.remove("open");
 modal.setAttribute("aria-hidden","true");
}
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});
document.getElementById("modalClose").onclick=closeModal;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

function reading(){
 const complete=cards.length>=spread.cards;
 const positions=spread.id==="three"?["Pasado","Presente","Futuro"]:Array.from({length:spread.cards},(_,i)=>`Carta ${i+1}`);
 app.innerHTML=`<main class="page reading"><button class="back" id="back">← Tiradas</button><p class="eyebrow">${spread.name.toUpperCase()}</p><h2>${complete?"Tu lectura":"Concéntrate en tu pregunta"}</h2><p class="intro">${complete?"Toca cualquier carta para ver su explicación.":`${cards.length} de ${spread.cards} cartas reveladas`}</p><section class="cards">${cards.map((c,i)=>`<article class="tarot-item ${c[5]?"reversed":""}"><div class="card-frame"><img class="card-image" src="${c[3]}" alt="${c[0]}" data-index="${i}"></div><div class="card-label"><div class="card-position">${positions[i]||`Carta ${i+1}`}</div><div class="card-name">${c[0]}</div><div class="card-state">${c[5]?"INVERTIDA":"AL DERECHO"}</div><div class="tap-hint">Toca la carta para ver la explicación</div></div></article>`).join("")}${complete?"":`<button class="draw-card" id="draw">Revelar ${cards.length+1}ª carta <span>✦</span></button>`}</section>${complete?`<button class="primary" id="new">Nueva lectura</button>`:""}</main>`;
 document.getElementById("back").onclick=spreadsPage;
 document.querySelectorAll(".card-image").forEach(img=>img.onclick=()=>openCard(cards[Number(img.dataset.index)]));
 if(!complete)document.getElementById("draw").onclick=draw;
 else document.getElementById("new").onclick=spreadsPage;
}
home();
</script>
</body>
</html>
