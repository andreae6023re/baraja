<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Millennial Tarot</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');
:root{--bg:#111317;--panel:#191b20;--line:#45423d;--text:#e8e0d2;--muted:#aaa294;--gold:#c6a875}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#292721 0,#111317 42rem);color:var(--text);font-family:Inter,sans-serif;min-height:100vh}button{font:inherit}
.page{width:min(100% - 36px,1000px);margin:auto;padding:42px 0 70px}.home{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.ornament{color:var(--gold);font-size:28px;margin-bottom:22px}.eyebrow{color:var(--gold);letter-spacing:.28em;font-size:11px;font-weight:600;margin:0 0 20px}
h1,h2,h3{font-family:"Cormorant Garamond",serif;font-weight:500}h1{font-size:clamp(52px,10vw,88px);line-height:.82;margin:0}h1 em{color:var(--gold)}
h2{font-size:clamp(42px,8vw,64px);margin:0 0 5px}.intro{color:var(--muted);line-height:1.7;max-width:500px;margin:12px auto 28px}
.primary{border:1px solid var(--gold);background:transparent;color:var(--text);padding:14px 25px;border-radius:2px;cursor:pointer}.primary:hover{background:var(--gold);color:#151515}
.footer-note{color:#77746d;font-family:"Cormorant Garamond",serif;font-size:16px;margin-top:50px}.back{border:0;background:none;color:var(--muted);padding:0;cursor:pointer;margin-bottom:48px}
.spread-list{display:grid;gap:12px;margin-top:35px}.spread-card{width:100%;display:grid;grid-template-columns:55px 1fr auto;align-items:center;gap:18px;text-align:left;border:1px solid var(--line);background:rgba(25,27,32,.78);color:var(--text);padding:20px;cursor:pointer}
.spread-card:hover{border-color:var(--gold);transform:translateY(-2px)}.spread-number{color:var(--gold);font-family:"Cormorant Garamond",serif;font-size:28px}
.spread-card strong{display:block;font-family:"Cormorant Garamond",serif;font-size:25px;font-weight:500}.spread-card small{display:block;color:var(--muted);margin-top:3px}.arrow{color:var(--gold);font-size:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:30px;margin-top:32px}.tarot-card{text-align:center}
.card-frame{background:#0d0e10;border:1px solid #5d513c;padding:7px;box-shadow:0 12px 40px #0008;max-width:330px;margin:auto}.card-frame img{display:block;width:100%;height:auto}.reversed .card-frame img{transform:rotate(180deg)}
.card-position{color:var(--gold);font-size:10px;letter-spacing:.2em;text-transform:uppercase;margin:16px 0 7px}.tarot-card h3{font-size:28px;margin:0 0 4px}.orientation{color:var(--gold);font-size:9px;letter-spacing:.16em}
.draw-card{min-height:330px;border:1px dashed #575044;background:transparent;color:var(--gold);cursor:pointer;font-family:"Cormorant Garamond",serif;font-size:24px;display:flex;align-items:center;justify-content:center;flex-direction:column}.draw-card:hover{background:#c6a87510;border-color:var(--gold)}.draw-card span{margin-top:12px}
.reading .primary{margin-top:30px}
@media(max-width:600px){.page{padding-top:28px}.back{margin-bottom:34px}.cards{grid-template-columns:1fr;gap:36px}.card-frame{max-width:340px}.draw-card{min-height:340px}}
</style></head><body><div id="app"></div><script>
const app=document.getElementById("app");
const deck=[{"id": 0, "name": "El Loco", "file": "carta-00-el-loco.jpg"}, {"id": 1, "name": "El Mago", "file": "carta-01-el-mago.jpg"}, {"id": 2, "name": "La Sacerdotisa", "file": "carta-02-la-sacerdotisa.jpg"}, {"id": 3, "name": "El Emperador", "file": "carta-03-el-emperador.jpg"}, {"id": 4, "name": "La Emperatriz", "file": "carta-04-la-emperatriz.jpg"}, {"id": 5, "name": "Los Enamorados", "file": "carta-05-los-enamorados.jpg"}, {"id": 6, "name": "El Hierofante", "file": "carta-06-el-hierofante.jpg"}, {"id": 7, "name": "El Carro", "file": "carta-07-el-carro.jpg"}, {"id": 8, "name": "La Fuerza", "file": "carta-08-la-fuerza.jpg"}, {"id": 9, "name": "El Ermitaño", "file": "carta-09-el-hermitano.jpg"}, {"id": 10, "name": "La Rueda de la Fortuna", "file": "carta-10-la-rueda-de-la-fortuna.jpg"}, {"id": 11, "name": "La Justicia", "file": "carta-11-la-justicia.jpg"}, {"id": 12, "name": "El Colgado", "file": "carta-12-el-colgado.jpg"}, {"id": 13, "name": "La Muerte", "file": "carta-13-la-muerte.jpg"}, {"id": 14, "name": "La Templanza", "file": "carta-14-la-templanza.jpg"}, {"id": 15, "name": "El Diablo", "file": "carta-15-el-diablo.jpg"}, {"id": 16, "name": "La Torre", "file": "carta-16-la-torre.jpg"}, {"id": 17, "name": "La Estrella", "file": "carta-17-la-estrella.jpg"}, {"id": 18, "name": "La Luna", "file": "carta-18-la-luna.jpg"}, {"id": 19, "name": "El Sol", "file": "carta-19-el-sol.jpg"}, {"id": 20, "name": "El Juicio", "file": "carta-20-el-juicio.jpg"}, {"id": 21, "name": "El Mundo", "file": "carta-21-el-mundo.jpg"}, {"id": 22, "name": "As de Copas", "file": "carta-22-as-de-copas.jpg"}, {"id": 23, "name": "Dos de Copas", "file": "carta-23-dos-de-copas.jpg"}, {"id": 24, "name": "Tres de Copas", "file": "carta-24-tres-de-copas.jpg"}, {"id": 25, "name": "Cuatro de Copas", "file": "carta-25-cuatro-de-copas.jpg"}, {"id": 26, "name": "Cinco de Copas", "file": "carta-26-cinco-de-copas.jpg"}, {"id": 27, "name": "Seis de Copas", "file": "carta-27-seis-de-copas.jpg"}, {"id": 28, "name": "Siete de Copas", "file": "carta-28-siete-de-copas.jpg"}, {"id": 29, "name": "Ocho de Copas", "file": "carta-29-ocho-de-copas.jpg"}, {"id": 30, "name": "Nueve de Copas", "file": "carta-30-nueve-de-copas.jpg"}, {"id": 31, "name": "Diez de Copas", "file": "carta-31-diez-de-copas.jpg"}, {"id": 32, "name": "Sota de Copas", "file": "carta-32-sota-de-copas.jpg"}, {"id": 33, "name": "Caballo de Copas", "file": "carta-33-caballo-de-copas.jpg"}, {"id": 34, "name": "Reina de Copas", "file": "carta-34-reina-de-copas.jpg"}, {"id": 35, "name": "Rey de Copas", "file": "carta-35-rey-de-copas.jpg"}, {"id": 36, "name": "As de Bastos", "file": "carta-36-as-de-bastos.jpg"}, {"id": 37, "name": "Dos de Bastos", "file": "carta-37-dos-de-bastos.jpg"}, {"id": 38, "name": "Tres de Bastos", "file": "carta-38-tres-de-bastos.jpg"}, {"id": 39, "name": "Cuatro de Bastos", "file": "carta-39-cuatro-de-bastos.jpg"}, {"id": 40, "name": "Cinco de Bastos", "file": "carta-40-cinco-de-bastos.jpg"}, {"id": 41, "name": "Seis de Bastos", "file": "carta-41-seis-de-bastos.jpg"}, {"id": 42, "name": "Siete de Bastos", "file": "carta-42-siete-de-bastos.jpg"}, {"id": 43, "name": "Ocho de Bastos", "file": "carta-43-ocho-de-bastos.jpg"}, {"id": 44, "name": "Nueve de Bastos", "file": "carta-44-nueve-de-bastos.jpg"}, {"id": 45, "name": "Diez de Bastos", "file": "carta-45-diez-de-bastos.jpg"}, {"id": 46, "name": "Sota de Bastos", "file": "carta-46-sota-de-bastos.jpg"}, {"id": 47, "name": "Caballo de Bastos", "file": "carta-47-caballo-de-bastos.jpg"}, {"id": 48, "name": "Reina de Bastos", "file": "carta-48-reina-de-bastos.jpg"}, {"id": 49, "name": "Rey de Bastos", "file": "carta-49-rey-de-bastos.jpg"}, {"id": 50, "name": "As de Espadas", "file": "carta-50-as-de-espadas.jpg"}, {"id": 51, "name": "Dos de Espadas", "file": "carta-51-dos-de-espadas.jpg"}, {"id": 52, "name": "Tres de Espadas", "file": "carta-52-tres-de-espadas.jpg"}, {"id": 53, "name": "Cuatro de Espadas", "file": "carta-53-cuatro-de-espadas.jpg"}, {"id": 54, "name": "Cinco de Espadas", "file": "carta-54-cinco-de-espadas.jpg"}, {"id": 55, "name": "Seis de Espadas", "file": "carta-55-seis-de-espadas.jpg"}, {"id": 56, "name": "Siete de Espadas", "file": "carta-56-siete-de-espadas.jpg"}, {"id": 57, "name": "Ocho de Espadas", "file": "carta-57-ocho-de-espadas.jpg"}, {"id": 58, "name": "Nueve de Espadas", "file": "carta-58-nueve-de-espadas.jpg"}, {"id": 59, "name": "Diez de Espadas", "file": "carta-59-diez-de-espadas.jpg"}, {"id": 60, "name": "Sota de Espadas", "file": "carta-60-sota-de-espadas.jpg"}, {"id": 61, "name": "Caballo de Espadas", "file": "carta-61-caballo-de-espadas.jpg"}, {"id": 62, "name": "Reina de Espadas", "file": "carta-62-reina-de-espadas.jpg"}, {"id": 63, "name": "Rey de Espadas", "file": "carta-63-rey-de-espadas.jpg"}, {"id": 64, "name": "As de Oros", "file": "carta-64-as-de-oros.jpg"}, {"id": 65, "name": "Dos de Oros", "file": "carta-65-dos-de-oros.jpg"}, {"id": 66, "name": "Tres de Oros", "file": "carta-66-tres-de-oros.jpg"}, {"id": 67, "name": "Cuatro de Oros", "file": "carta-67-cuatro-de-oros.jpg"}, {"id": 68, "name": "Cinco de Oros", "file": "carta-68-cinco-de-oros.jpg"}, {"id": 69, "name": "Seis de Oros", "file": "carta-69-seis-de-oros.jpg"}, {"id": 70, "name": "Siete de Oros", "file": "carta-70-siete-de-oros.jpg"}, {"id": 71, "name": "Ocho de Oros", "file": "carta-71-ocho-de-oros.jpg"}, {"id": 72, "name": "Nueve de Oros", "file": "carta-72-nueve-de-oros.jpg"}, {"id": 73, "name": "Diez de Oros", "file": "carta-73-diez-de-oros.jpg"}, {"id": 74, "name": "Sota de Oros", "file": "carta-74-sota-de-oros.jpg"}, {"id": 75, "name": "Caballo de Oros", "file": "carta-75-caballo-de-oros.jpg"}, {"id": 76, "name": "Reina de Oros", "file": "carta-76-reina-de-oros.jpg"}, {"id": 77, "name": "Rey de Oros", "file": "carta-77-rey-de-oros.jpg"}];
const spreads=[
{id:"one",name:"Una carta",description:"Una carta para iluminar tu pregunta.",cards:1},
{id:"three",name:"Tres cartas",description:"Pasado · Presente · Futuro.",cards:3},
{id:"celtic",name:"Cruz Celta",description:"La tirada clásica de 10 cartas.",cards:10},
{id:"custom",name:"Personalizada",description:"Una tirada de 5 cartas.",cards:5}];
let spread=null,drawn=[];
function home(){app.innerHTML=`<main class="page home"><div class="ornament">✦</div><p class="eyebrow">MILLENNIAL TAROT</p><h1>Tu lectura.<br><em>Tu intuición.</em></h1><p class="intro">Elige una tirada, respira y deja que las cartas hablen.</p><button class="primary" id="start">Comenzar lectura</button><div class="footer-note">A little magic for ordinary days ✦</div></main>`;document.getElementById("start").onclick=spreadsPage}
function spreadsPage(){app.innerHTML=`<main class="page"><button class="back" id="back">← Volver</button><p class="eyebrow">MILLENNIAL TAROT</p><h2>Elige tu tirada</h2><p class="intro">¿Qué quieres explorar hoy?</p><section class="spread-list">${spreads.map(s=>`<button class="spread-card" data-id="${s.id}"><span class="spread-number">${String(s.cards).padStart(2,"0")}</span><span><strong>${s.name}</strong><small>${s.description}</small></span><span class="arrow">→</span></button>`).join("")}</section></main>`;document.getElementById("back").onclick=home;document.querySelectorAll(".spread-card").forEach(b=>b.onclick=()=>{spread=spreads.find(s=>s.id===b.dataset.id);drawn=[];reading()})}
function draw(){const available=deck.filter(c=>!drawn.some(x=>x.id===c.id));const c=available[Math.floor(Math.random()*available.length)];drawn.push({...c,reversed:Math.random()<.25});reading()}
function reading(){const complete=drawn.length>=spread.cards;const pos=spread.id==="three"?["Pasado","Presente","Futuro"]:drawn.map((_,i)=>`Carta ${i+1}`);
app.innerHTML=`<main class="page reading"><button class="back" id="back">← Tiradas</button><p class="eyebrow">${spread.name.toUpperCase()}</p><h2>${complete?"Tu lectura":"Concéntrate en tu pregunta"}</h2><p class="intro">${complete?"Estas son tus cartas.":`${drawn.length} de ${spread.cards} cartas reveladas`}</p><section class="cards">${drawn.map((c,i)=>`<article class="tarot-card ${c.reversed?"reversed":""}"><div class="card-frame"><img src="${c.file}" alt="${c.name}"></div><div class="card-position">${pos[i]||`Carta ${i+1}`}</div><h3>${c.name}</h3><div class="orientation">${c.reversed?"INVERTIDA":"AL DERECHO"}</div></article>`).join("")}${complete?"":`<button class="draw-card" id="draw">Revelar ${drawn.length+1}ª carta <span>✦</span></button>`}</section>${complete?`<button class="primary" id="new">Nueva lectura</button>`:""}</main>`;
document.getElementById("back").onclick=spreadsPage;if(!complete)document.getElementById("draw").onclick=draw;else document.getElementById("new").onclick=spreadsPage}
home();
</script></body></html>
